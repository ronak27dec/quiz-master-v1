<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Chapter</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/create-form.css') }}">
</head>
<body>
<div class="form-container">
    <form action="/edit-chapter/{{chapter.id}}" method="POST">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text"
                   id="name"
                   name="name"
                   value="{{ chapter.chapter_name | e }}"
                   required>
        </div>
        <div class="form-group">
            <label for="chapter-description">Chapter Description</label>
            <textarea id="chapter-description"
                      name="chapter_description"
                      required>{{ chapter.chapter_description }}
            </textarea>
        </div>

        <div class="form-buttons">
            <button type="submit" class="btn-login">Update Chapter</button>
            <button type="button" class="btn-signup" onclick="window.location.href='/chapters/{{chapter.subject_id}}'">Cancel</button>
        </div>

    </form>
</div>
</body>
</html>

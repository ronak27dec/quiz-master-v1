<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Question</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/create-form.css') }}">
</head>
<body>
<div class="form-container">
    <form action="/edit-question/{{question.id}}" method="POST">
        <div class="form-group">
            <label for="title">Question Statement</label>
            <input type="text"
                   id="title"
                   name="title"
                   value="{{ question.question_title | e }}"
                   required>
        </div>
        <div class="form-group">
            <label for="option-a">Option A</label>
            <input type="text"
                   id="option-a"
                   name="option-a"
                   value="{{ question.option_a | e }}"
                   required>
        </div>
        <div class="form-group">
            <label for="option-b">Option B</label>
            <input type="text"
                   id="option-b"
                   name="option-b"
                   value="{{ question.option_b | e }}"
                   required>
        </div>
        <div class="form-group">
            <label for="option-c">Option C</label>
            <input type="text"
                   id="option-c"
                   name="option-c"
                   value="{{ question.option_c | e }}"
                   required>
        </div>
        <div class="form-group">
            <label for="option-d">Option D</label>
            <input type="text"
                   id="option-d"
                   name="option-d"
                   value="{{ question.option_d | e }}"
                   required>
        </div>
        <div class="form-group">
            <label for="correct-option">Correct Answer</label>
            <input type="text"
                   id="correct-option"
                   name="correct-option"
                   value="{{ question.correct_option | e }}"
                   required>
        </div>
        <div class="form-buttons">
            <button type="submit" class="btn-login">Update Question</button>
            <button type="button" class="btn-signup" onclick="window.location.href='/question/{{question.quiz_id}}'">Cancel</button>
        </div>
    </form>
</div>
</body>
</html>

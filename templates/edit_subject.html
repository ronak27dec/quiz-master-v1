<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title>Edit Subject</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
              rel="stylesheet">
        <link rel="stylesheet"
              type="text/css"
              href="{{ url_for('static', filename='css/create-form.css') }}">


    </head>

    <body>
        <div class="form-container">
            <form action="/edit-subject/{{subject.id}}"
                  method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text"
                           id="name"
                           name="name"
                           value="{{ subject.subject_name | e }}"
                           required>
                </div>
                <div class="form-group">
                    <label for="subject-description">Description</label>
                    <textarea id="subject-description"
                              name="subject_description"
                              required>{{ subject.subject_description }}
            </textarea>
                </div>

                <div class="form-buttons">
                    <button type="submit"
                            class="btn-login">Update Subject</button>
                    <button type="button"
                            class="btn-signup"
                            onclick="window.location.href='/admin-dashboard'">Cancel</button>
                </div>
            </form>
        </div>
    </body>

</html>

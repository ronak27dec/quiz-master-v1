<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/create-form.css') }}">
</head>

<body>
    <div class="form-container">
        <form action="/edit-quiz/{{quiz.id}}" method="POST">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="name" id="name" name="name" value="{{ quiz.quiz_name | e }}" required>
            </div>
            <div class="form-group">
                <label for="quiz-date">Due Date</label>
                <input type="date" id="quiz-date" name="date" value={{quiz.quiz_date}} required>
            </div>
            <div class="form-group">
                <label for="duration">Time Duration (in mins)</label>
                <input type="text" id="duration" name="duration" value="{{ quiz.quiz_duration | e }}" required>
            </div>
            <div class="form-group">
                <label for="remark">Remarks</label>
                <input type="text" id="remark" name="remark" value="{{ quiz.quiz_remark | e }}" required>
            </div>
            <div class="form-buttons">
                <button type="submit" class="btn-login">Update Quiz</button>
                <button type="button" class="btn-signup"
                    onclick="window.location.href='/quiz/{{quiz.chapter_id}}'">Cancel</button>
            </div>

        </form>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/list.css') }}">
    <style>
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;

        }
        .option {
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
            cursor: pointer;
        }
        .option:hover {
            background-color: #d3d3d3;
            color: #000;
        }
        input[type="radio"] {
            width: 15px;
            height: 15px;
            margin-right: 10px;
        }
        .timer {
            font-size: 1.0em;
            font-weight: bold;
            position: fixed;
            top: 10px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
<div class="timer" id="timer">Time Remaining: {{ quiz.quiz_duration }}:00</div>
<div class="table-container">
    <form id="quiz-form" action="/submit-quiz/{{quiz.id}}" method="POST">
        <table>
            <thead>
            <h2>{{quiz.quiz_name}}</h2>
            </thead>
            <tbody>
            {% for question in quiz.questions %}
            <tr>
                <td>
                    <div class="card-row">
                        <div class="card-content">
                            <h4>{{ question.question_title }}</h4>
                            <div class="options">
                                <label class="option">
                                    <input type="radio" name="question_{{ question.id }}" value="{{ question.option_a }}">
                                    {{ question.option_a }}
                                </label>
                                <label class="option">
                                    <input type="radio" name="question_{{ question.id }}" value="{{ question.option_b }}">
                                    {{ question.option_b }}
                                </label>
                                <label class="option">
                                    <input type="radio" name="question_{{ question.id }}" value="{{ question.option_c }}">
                                    {{ question.option_c }}
                                </label>
                                <label class="option">
                                    <input type="radio" name="question_{{ question.id }}" value="{{ question.option_d }}">
                                    {{ question.option_d }}
                                </label>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
        <div class="form-buttons" style="text-align: center; margin-top: 30px;">
            <button type="submit"
                    style="padding: 10px 20px; font-size: 18px; background-color: #2F4F4F; color: white; border: none; border-radius: 5px; cursor: pointer;">
                Submit Quiz
            </button>
        </div>
    </form>
</div>
</div>
<script>
        const quizDurationMinutes = {{ quiz.quiz_duration }};
        let timeRemaining = quizDurationMinutes * 60;

        function updateTimer() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('timer').textContent = `Time Remaining: ${minutes}:${seconds.toString().padStart(2, '0')}`;

            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                alert('Time is up! Submitting your quiz.');
                document.getElementById('quiz-form').submit();
            } else {
                timeRemaining--;
            }
        }

        const timerInterval = setInterval(updateTimer, 1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
              rel="stylesheet">
        <link rel="stylesheet"
              type="text/css"
              href="{{ url_for('static', filename='css/create-form.css') }}">
        <title>Login</title>
    </head>

    <body>
        <div class="form-container">
            <h2>Welcome to Quiz Master</h2>
            <form action="/login"
                  method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder=""
                           required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder=""
                           required>
                </div>
                <div class="form-buttons">
                    <button type="submit"
                            class="btn-login">Login</button>
                    <button type="button"
                            class="btn-signup"
                            onclick="window.location.href='/register'">SignUp</button>
                </div>
            </form>
        </div>

        <div>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="flash-message">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}
        </div>

    </body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/create-form.css') }}">
</head>
<body>
<div class="form-container">
    <form action="/create-quiz/{{chapter.id}}" method="POST">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text"
                   id="name"
                   name="name"
                   placeholder=""
                   required>
        </div>
        <div class="form-group">
            <label for="quiz-date">Due Date</label>
            <input type="date"
                   id="quiz-date"
                   name="date"
                   required>
        </div>
        <div class="form-group">
            <label for="duration">Time Duration (in mins)</label>
            <input type="text"
                   id="duration"
                   name="duration"
                   placeholder=""
                   required>
        </div>
        <div class="form-group">
            <label for="remark">Remarks</label>
            <input type="text"
                   id="remark"
                   name="remark"
                   placeholder=""
                   required>
        </div>
        <div class="form-buttons">
            <button type="submit" class="btn-login">Add New Quiz</button>
            <button type="button" class="btn-signup" onclick="window.location.href='/quiz/{{chapter.id}}'">Cancel</button>
        </div>

    </form>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="flash-message">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}
</div>

</body>
</html>

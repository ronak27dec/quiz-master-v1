<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/list.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/top-bar.css') }}">
</head>
<body>

{% include 'top_bar.html' %}

<div class="table-container">
    <table>
        <thead>
        </thead>
        <tbody>
        <tr>
            <td>
                <div class="card-row">
                    <div class="card-content">
                        <h4>Quiz Results: {{ quiz.quiz_name }}</h4>
                        <p>Your Score is: {{ score }}/{{ total_questions }} ({{ percentage_score }}%)</p>
                    </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="table-container">
    <table>
        <thead>
        </thead>
        <tbody>
        {% for result in results %}
        <tr>
            <td>
                <div class="card-row">
                    <div class="card-content">
                        <h4> {{ result.question }} </h4>
                        <p>
                            <strong>Your Answer:</strong>
                            <span style="color: {% if result.user_answer != result.correct_answer %}red{% else %}green{% endif %};">
                            {{ result.user_answer }}
                            </span>
                        </p>
                        <p><strong>Correct Answer:</strong> {{ result.correct_answer }}</p>
                    </div>
                    {% endfor %}
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Subject</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/create-form.css') }}">
</head>
<body>
<div class="form-container">
    <form action="/create-subject" method="POST">
        <div class="form-group">
            <label for="subject_name">Name</label>
            <input type="text" id="subject_name" name="subject_name" placeholder="" required>
        </div>
        <div class="form-group">
            <label for="subject_description">Description</label>
            <input type="text" id="subject_description" name="subject_description"
                   placeholder="" required>
        </div>
        <div class="form-buttons">
            <button type="submit" class="btn-login">Add New Subject</button>
            <button type="button" class="btn-signup" onclick="window.location.href='/admin-dashboard'">Cancel</button>
        </div>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title>Add Chapter</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
              rel="stylesheet">
        <link rel="stylesheet"
              type="text/css"
              href="{{ url_for('static', filename='css/create-form.css') }}">
    </head>

    <body>
        <div class="form-container">
            <form action="/create-chapter/{{subject.id}}"
                  method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text"
                           id="name"
                           name="name"
                           placeholder=""
                           required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="description"
                           id="description"
                           name="description"
                           placeholder=""
                           required>
                </div>


                <div class="form-buttons">
                    <button type="submit"
                            class="btn-login">Add New Chapter</button>
                    <button type="button"
                            class="btn-signup"
                            onclick="window.location.href='/chapters/{{subject.id}}'">Cancel</button>
                </div>
            </form>
        </div>
    </body>

</html>

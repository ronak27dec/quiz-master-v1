<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <title>Change Password</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
              rel="stylesheet">
        <link rel="stylesheet"
              type="text/css"
              href="{{ url_for('static', filename='css/create-form.css') }}">

    </head>

    <body>


        <div class="form-container">
            <form action="/change-password/{{user.id}}"
                  method="POST">
                <div class="form-group">
                    <label for="old-password">Old Password</label>
                    <input type="password"
                           id="old-password"
                           name="old-password"
                           placeholder=""
                           required>
                </div>
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password"
                           id="new-password"
                           name="new-password"
                           placeholder=""
                           required>
                </div>
                <div class="form-group">
                    <label for="reenter-password">Re enter new Password</label>
                    <input type="password"
                           id="reenter-password"
                           name="reenter-password"
                           placeholder=""
                           required>
                </div>
                <div class="form-buttons">
                    <button type="submit"
                            class="btn-login">Update Password</button>
                    <button type="button"
                            class="btn-signup"
                            onclick="window.location.href='/user-profile'">Cancel</button>
                </div>

            </form>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="flash-message">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}
        </div>
    </body>

</html>
